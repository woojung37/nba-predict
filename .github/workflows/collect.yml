name: Collect NBA data

on:
  schedule:
    # GitHub runs scheduled jobs late, worst on the hour, so each slot gets two
    # off-the-hour runs; one usually lands within ~10-20 min of the target.
    # Target 06:00 KST (21:00 UTC): injuries and predictions before tip-off
    - cron: "43 20 * * *"
    - cron: "7 21 * * *"
    # Target 12:00 KST (03:00 UTC): most US games are final by now
    - cron: "43 2 * * *"
    - cron: "7 3 * * *"
    # Target 15:00 KST (06:00 UTC): late finals, injuries and next games listed
    - cron: "43 5 * * *"
    - cron: "7 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and predict
        run: python -m collector.collect daily
      - name: Validate
        run: python -m collector.validate
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update NBA data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
          # version asset URLs so browsers pick up a new deploy instead of a cached script
          sed -i -E "s/(app\.js|teams_ko\.js|style\.css)\"/\1?v=${GITHUB_SHA::7}\"/g" _site/index.html
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
