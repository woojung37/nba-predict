name: Collect NBA data

on:
  schedule:
    # 06:00 UTC = 15:00 KST: last night's US games are final, next games are listed
    - cron: "0 6 * * *"
    # 21:30 UTC = 06:30 KST: refresh injuries and lineups before tip-off
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: python -m collector.collect daily
      - name: Validate
        run: python -m collector.validate
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update NBA data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
